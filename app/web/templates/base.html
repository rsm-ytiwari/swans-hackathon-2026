<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Case digest{% endblock %}</title>
  {# Public Sans when online; falls back to the system font offline (demo still works with wifi off). #}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/static/tailwind.js"></script>
  <script>
    // Design tokens (shared by both views). Replace values from plan/ui-spec.md, not per page.
    tailwind.config = {
      theme: { extend: {
        // Target design tokens (prototype/target-design/HANDOFF.md). Colour only for meaning.
        colors: {
          ink: '#14172B', body: '#2E3244', muted: '#5B6070', line: '#E3E5EB', hair: '#EEF0F3',
          surface: '#F4F5F8', chip: '#F1F2F6',
          brand: '#3B2BD9', brandbg: '#F4F2FF', brandline: '#D9D5FB',   // firm accent (indigo)
          teal: '#0E6B5C', tealbg: '#E7F3F0',                         // provider portal accent
          ok: '#067647', okbg: '#ECFDF3', warn: '#B54708', warnbg: '#FEF3E2', bad: '#B42318', badbg: '#FDECEA',
        },
        borderRadius: { card: '14px' },
        fontFamily: { sans: ['"Public Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      } }
    }
  </script>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/alpine.min.js" defer></script>
</head>
<body class="bg-surface text-ink font-sans antialiased">
  {% block body %}{% endblock %}

  {# One shared dialog for click-to-source. Any element with hx-get="/source/..." hx-target="#source-body" opens it. #}
  <dialog id="source-dialog" class="rounded-xl p-0 w-full max-w-2xl backdrop:bg-black/40">
    <div class="flex items-center justify-between border-b border-line px-5 py-3">
      <span class="text-sm font-medium text-muted">Source record</span>
      <button onclick="this.closest('dialog').close()" class="text-muted hover:text-ink">✕</button>
    </div>
    <div id="source-body" class="px-5 py-4 max-h-[70vh] overflow-y-auto text-sm"></div>
  </dialog>
  <script>
    document.body.addEventListener('htmx:afterSwap', (e) => {
      if (e.detail.target.id === 'source-body') document.getElementById('source-dialog').showModal();
    });
  </script>
</body>
</html>
